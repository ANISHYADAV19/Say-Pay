<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0D9488" />
    <meta name="description" content="Say & Pay — manage your shopping list with your voice." />
    <title>Say & Pay — Voice Shopping List</title>
    <script>
      // Apply the saved (or system) theme BEFORE first paint to avoid a
      // flash of the wrong theme. Mirrors the store key in src/services/storage.js.
      (function () {
        try {
          var stored = null
          try {
            var raw = localStorage.getItem('sayandpay.v1')
            if (raw) stored = JSON.parse(raw).theme
          } catch (e) {}
          var dark = stored === 'dark' || stored === 'light'
            ? stored === 'dark'
            : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0B0F14' : '#0D9488')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
