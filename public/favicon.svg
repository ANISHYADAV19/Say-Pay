<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Say and Pay voice shopping list">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14B8A6" />
      <stop offset="1" stop-color="#0D9488" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <g id="glyph" transform="translate(-2 -2)">
    <!-- Shopping bag handle -->
    <path d="M20 27 A7 7 0 0 1 34 27" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <!-- Shopping bag body -->
    <rect x="16" y="27" width="22" height="21" rx="4" fill="#ffffff" />
    <!-- Voice / sound waves -->
    <g fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round">
      <path d="M42 32 A5 5 0 0 1 42 42" />
      <path d="M42 26 A11 11 0 0 1 42 48" />
    </g>
  </g>
</svg>
